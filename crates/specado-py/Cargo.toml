[package]
name = "specado-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
specado-core.workspace = true
pyo3 = { version = "0.22.6", features = ["extension-module", "abi3-py39"] }

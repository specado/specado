provider: openai
api: openai_responses

auth:
  type: bearer
  token_env: OPENAI_API_KEY

endpoints:
  chat:
    method: POST
    url: https://api.openai.com/v1/responses
    headers:
      Content-Type: application/json

mappings:
  request:
    - from: "$.metadata.openai_model"
      to: "$.model"
    - from: "$.metadata.openai_max_output_tokens"
      to: "$.max_output_tokens"
    - from: "$.metadata.openai_reasoning_effort"
      to: "$.reasoning.effort"
    - from: "$.metadata.openai_text_verbosity"
      to: "$.text.verbosity"
    - from: "$.messages"
      to: "$.messages"
  response:
    - from: "$.output[?(@.type=='message')].content[0].text"
      to: "content"
    - from: "$.output[?(@.type=='message')].status"
      to: "finish_reason"

constraints:
  supports:
    json_mode: true
    tools: true

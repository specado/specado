inherits: ./_base-responses.yaml

models:
  - id: gpt-5
  - id: gpt-5-mini
  - id: gpt-5-nano

capabilities:
  context_window: 256000
  supports_tools: true
  supports_custom_tools: true
  responses_api: true
  reasoning_controls: ["effort", "verbosity"]

unsupported_parameters:
  - "$.sampling.temperature"
  - "$.sampling.top_p"
  - "$.sampling.top_k"

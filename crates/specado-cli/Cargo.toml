[package]
name = "specado-cli-temp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Specado command-line interface for validating and executing provider specs."
readme = "../../README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["ai", "llm", "cli"]
publish = true

[features]
default = ["hot-reload", "audit-logging"]
hot-reload = ["specado/hot-reload"]
audit-logging = ["specado/audit-logging"]

[[bin]]
name = "specado"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap.workspace = true
colored.workspace = true
clap_complete = "4.5"
serde_json.workspace = true
serde_yaml.workspace = true
specado = { workspace = true, features = ["hot-reload", "audit-logging"] }
specado-schemas.workspace = true
tokio.workspace = true
dirs = "5.0"
dotenvy = "0.15"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
httpmock = "0.7"
serde_json.workspace = true
serde_yaml.workspace = true
tempfile = "3.10"

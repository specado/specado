[package]
name = "specado-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["hot-reload", "audit-logging"]
hot-reload = ["specado-core/hot-reload"]
audit-logging = ["specado-core/audit-logging"]

[[bin]]
name = "specado"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap.workspace = true
colored.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
specado-core = { workspace = true, features = ["hot-reload", "audit-logging"] }
specado-schemas.workspace = true
tokio.workspace = true

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
httpmock = "0.7"
serde_json.workspace = true
serde_yaml.workspace = true
tempfile = "3.10"

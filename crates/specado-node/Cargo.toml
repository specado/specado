[package]
name = "specado-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["hot-reload", "audit-logging"]
hot-reload = ["specado-core/hot-reload"]
audit-logging = ["specado-core/audit-logging"]

[lib]
crate-type = ["cdylib"]

[dependencies]
specado-core = { workspace = true, features = ["hot-reload", "audit-logging"] }
napi = { version = "2.16.11", features = ["async", "serde-json", "tokio_rt"] }
napi-derive = "2.16.8"
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true

[build-dependencies]
napi-build = "2.0"

[package.metadata.napi]
name = "specado"

name: Publish to PyPI

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: Release version (e.g., 1.0.0)
    secrets:
      PYPI_TOKEN:
        required: true

env:
  PYTHON_VERSION: '3.11'

concurrency:
  group: publish-${{ inputs.version }}-pypi
  cancel-in-progress: false

jobs:
  publish_pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/specado/${{ inputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: specado-release-${{ inputs.version }}
          path: artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_NON_INTERACTIVE: 1
        run: |
          set -euo pipefail
          python -m twine upload \
            --disable-progress-bar \
            --skip-existing \
            artifacts/python/*

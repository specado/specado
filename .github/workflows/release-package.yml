name: Release Package

on:
  workflow_call:
    inputs:
      version:
        description: Version string derived from the release tag
        required: true
        type: string
      skip_release:
        description: Whether to skip packaging
        required: false
        type: string
        default: "false"
    outputs:
      artifact_name:
        description: Name of the uploaded artifact bundle
        value: ${{ jobs.package.outputs.artifact_name }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  package:
    runs-on: ubuntu-latest
    if: ${{ inputs.skip_release != 'true' }}
    outputs:
      artifact_name: ${{ steps.outputs.outputs.artifact_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install maturin tomli

      - name: Validate tag matches versions
        env:
          TAG_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python scripts/check_version_alignment.py "${TAG_VERSION}"

      - name: Build CLI binary
        run: cargo build --release --locked --package specado-cli

      - name: Prepare dist directories
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/python dist/npm dist/cli

      - name: Build Python distributions
        run: maturin build -m crates/specado-py/Cargo.toml --release --out dist/python --sdist

      - name: Build Node.js package
        run: |
          cd crates/specado-node
          npm ci
          npm run build
          npm pack --pack-destination ../../dist/npm

      - name: Collect CLI artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cp target/release/specado dist/cli/specado
          pushd dist/cli >/dev/null
          tar czf "specado-${VERSION}-linux-x86_64.tar.gz" specado
          rm specado
          popd >/dev/null

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload aggregated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: specado-release-${{ inputs.version }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Expose artifact name
        id: outputs
        run: echo "artifact_name=specado-release-${{ inputs.version }}" >> "$GITHUB_OUTPUT"

name: Create GitHub Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      is_prerelease:
        required: true
        type: string
      npm_dist_tag:
        required: true
        type: string
      specado_pkg:
        required: true
        type: string
    secrets:
      GITHUB_TOKEN:
        required: true

jobs:
  github_release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ inputs.is_prerelease }}
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
          SPECADO_PKG: ${{ inputs.specado_pkg }}
        with:
          script: |
            const version = process.env.VERSION;
            const tag = process.env.TAG;
            const prerelease = process.env.IS_PRERELEASE === 'true';
            const npmTag = process.env.NPM_DIST_TAG;
            const rustPkg = process.env.SPECADO_PKG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pythonInstall = prerelease
              ? `pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple specado==${version}`
              : `pip install specado==${version}`;
            const bodyLines = [
              '## Installation',
              '',
              `**npm (${npmTag} dist-tag)**`,
              '```bash',
              `npm install specado@${version}`,
              '```',
              '',
              `**Python${prerelease ? ' (Test PyPI)' : ''}**`,
              '```bash',
              pythonInstall,
              '```',
              '',
              '**Rust**',
              '```toml',
              `${rustPkg} = "${version}"`,
              '```',
              '',
              'Artifacts for this tag (npm tarball, Python wheels/sdist, CLI tarball, and SHA256 manifest) are attached to the workflow run and available from the respective registries.'
            ];
            const body = bodyLines.join('\n');

            async function createOrUpdateRelease() {
              try {
                const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.data.id,
                  tag_name: tag,
                  name: prerelease ? `Pre-release ${tag}` : `Release ${tag}`,
                  body,
                  prerelease
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.repos.createRelease({
                    owner,
                    repo,
                    tag_name: tag,
                    name: prerelease ? `Pre-release ${tag}` : `Release ${tag}`,
                    body,
                    prerelease
                  });
                } else {
                  throw error;
                }
              }
            }

            await createOrUpdateRelease();

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: specado-release-${{ inputs.version }}
          path: artifacts

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          if [[ -f artifacts/SHA256SUMS ]]; then
            assets+=("artifacts/SHA256SUMS")
          fi
          for file in artifacts/cli/*.tar.gz; do
            assets+=("$file")
          done
          for file in artifacts/cli/*.zip; do
            assets+=("$file")
          done
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets to upload."
            exit 0
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber

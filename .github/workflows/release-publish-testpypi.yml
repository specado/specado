name: Publish to Test PyPI

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: Release version (e.g., 1.0.0)
    secrets:
      TEST_PYPI_TOKEN:
        required: true

env:
  PYTHON_VERSION: '3.11'

concurrency:
  group: publish-${{ inputs.version }}-testpypi
  cancel-in-progress: false

jobs:
  publish_testpypi:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/specado/${{ inputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: specado-release-${{ inputs.version }}
          path: artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish to Test PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
          TWINE_NON_INTERACTIVE: 1
        run: |
          set -euo pipefail
          python -m twine upload \
            --repository-url https://test.pypi.org/legacy/ \
            --disable-progress-bar \
            --skip-existing \
            artifacts/python/*

  verify_testpypi:
    name: Verify Test PyPI package
    runs-on: ubuntu-latest
    needs: publish_testpypi
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test install from Test PyPI
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python -m venv test-venv
          source test-venv/bin/activate
          pip install --upgrade pip
          for attempt in {1..5}; do
            if pip install --index-url https://test.pypi.org/simple/ \
                          --extra-index-url https://pypi.org/simple \
                          "specado==${VERSION}"; then
              break
            fi
            if [[ $attempt -eq 5 ]]; then
              echo "Test PyPI package not available after retries" >&2
              exit 1
            fi
            echo "Test PyPI package not yet available (attempt ${attempt}); retrying in 30s..."
            sleep 30
          done
          python -c "import specado; print('Test PyPI package version:', specado.__version__)"

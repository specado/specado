name: Publish to npm

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: Release version (e.g., 1.0.0)
      npm_dist_tag:
        required: true
        type: string
        description: npm dist-tag to apply (e.g., latest or beta)
    secrets:
      NPM_TOKEN:
        required: true

env:
  NODE_VERSION: '18'

concurrency:
  group: publish-${{ inputs.version }}-npm
  cancel-in-progress: false

jobs:
  publish_npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/specado/v/${{ inputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: specado-release-${{ inputs.version }}
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Check if npm version already exists
        id: npm_version_check
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if npm view specado@"$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "specado@$VERSION already published; skipping npm publish step."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm_version_check.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/npm/*.tgz)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#files[@]}" >&2
            ls -l artifacts/npm
            exit 1
          fi
          npm publish "${files[0]}" --tag "$NPM_DIST_TAG"

      - name: Confirm npm publish skipped
        if: steps.npm_version_check.outputs.exists == 'true'
        run: echo "npm publish skipped because version already exists."

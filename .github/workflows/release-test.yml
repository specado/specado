name: Release Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: crates/specado-node/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install maturin twine pytest

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --workspace --locked --all-features

      - name: Build Node.js bindings
        run: |
          cd crates/specado-node
          npm ci
          npm run build

      - name: Run Node.js tests
        run: |
          cd crates/specado-node
          npm test

      - name: Build Python wheel for tests
        run: maturin build -m crates/specado-py/Cargo.toml --release --out dist-test

      - name: Run Python tests
        run: |
          python -m pip install dist-test/*.whl
          python -m pytest python/tests/ -v

name: Release Test

on:
  workflow_call:
    inputs:
      skip_release:
        description: Whether to skip this job
        required: false
        type: string
        default: "false"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ inputs.skip_release != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: crates/specado-node/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install maturin twine pytest

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --workspace --locked --all-features

      - name: Build Node.js bindings
        run: |
          cd crates/specado-node
          npm ci
          npm run build

      - name: Run Node.js tests
        run: |
          cd crates/specado-node
          npm test

      - name: Build Python wheel for tests
        run: maturin build -m crates/specado-py/Cargo.toml --release --out dist-test

      - name: Install wheel under test
        run: |
          python -m pip install dist-test/*.whl
          python - <<'PY'
import specado
from pathlib import Path
pkg_path = Path(specado.__file__).parent
native = list(pkg_path.glob('_native*.so'))
print('Installed package path:', pkg_path)
print('Native binaries:', native)
if not native:
    raise SystemExit('specado wheel missing native extension')
PY

      - name: Install python package from source for tests
        run: maturin develop -m crates/specado-py/Cargo.toml --release

      - name: Run Python tests
        run: python -m pytest python/tests/ -v

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip publishing steps (test/build/package only)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
  RUST_TOOLCHAIN: stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      npm_dist_tag: ${{ steps.meta.outputs.npm_dist_tag }}
      run_release: ${{ steps.meta.outputs.run_release }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      specado_schemas_pkg: ${{ steps.meta.outputs.specado_schemas_pkg }}
      specado_core_pkg: ${{ steps.meta.outputs.specado_core_pkg }}
      specado_pkg: ${{ steps.meta.outputs.specado_pkg }}
      specado_cli_pkg: ${{ steps.meta.outputs.specado_cli_pkg }}
    steps:
      - name: Compute release metadata
        id: meta
        run: |
          set -euo pipefail
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "npm_dist_tag=beta" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "npm_dist_tag=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "run_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
            echo "version=$SHORT_SHA" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

          for DIR in specado-schemas specado-core specado specado-cli; do
            MANIFEST="crates/${DIR}/Cargo.toml"
            if [[ ! -f "$MANIFEST" ]]; then
              echo "warn: manifest $MANIFEST not found" >&2
              continue
            fi
            PKG=$(sed -n 's/^name = "\(.*\)"/\1/p' "$MANIFEST" | head -n1)
            if [[ -z "$PKG" ]]; then
              echo "warn: unable to determine package name for $MANIFEST" >&2
              continue
            fi
            KEY="${DIR//-/_}_pkg"
            echo "${KEY}=${PKG}" >> "$GITHUB_OUTPUT"
          done

  test:
    name: Run tests
    needs: prepare
    if: needs.prepare.outputs.run_release == 'true'
    uses: ./.github/workflows/release-test.yml

  build:
    name: Build artifacts
    needs:
      - prepare
      - test
    if: needs.prepare.outputs.run_release == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  package:
    name: Package artifacts
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.run_release == 'true'
    uses: ./.github/workflows/release-package.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish_testpypi:
    name: Publish to Test PyPI
    needs:
      - prepare
      - package
    if: needs.prepare.outputs.run_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/release-publish-testpypi.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}

  publish_npm:
    name: Publish to npm
    needs:
      - prepare
      - package
    if: needs.prepare.outputs.run_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/release-publish-npm.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      npm_dist_tag: ${{ needs.prepare.outputs.npm_dist_tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_crates:
    name: Publish to crates.io
    needs:
      - prepare
      - package
    if: needs.prepare.outputs.run_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/release-publish-crates.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      specado_schemas_pkg: ${{ needs.prepare.outputs.specado_schemas_pkg }}
      specado_core_pkg: ${{ needs.prepare.outputs.specado_core_pkg }}
      specado_pkg: ${{ needs.prepare.outputs.specado_pkg }}
      specado_cli_pkg: ${{ needs.prepare.outputs.specado_cli_pkg }}
    secrets:
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  publish_pypi:
    name: Publish to PyPI
    needs:
      - prepare
      - publish_testpypi
      - publish_npm
      - publish_crates
    if: needs.prepare.outputs.run_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/release-publish-pypi.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  verify_all:
    name: Verify published artifacts
    needs:
      - prepare
      - publish_pypi
      - publish_npm
      - publish_crates
    if: needs.prepare.outputs.run_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/release-verify.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      is_prerelease: ${{ needs.prepare.outputs.is_prerelease }}
      npm_dist_tag: ${{ needs.prepare.outputs.npm_dist_tag }}
      crates_published: ${{ needs.publish_crates.outputs.published || 'false' }}
      specado_pkg: ${{ needs.prepare.outputs.specado_pkg }}
      specado_cli_pkg: ${{ needs.prepare.outputs.specado_cli_pkg }}

  github_release:
    name: Publish GitHub release
    needs:
      - prepare
      - verify_all
    if: needs.prepare.outputs.run_release == 'true' && needs.prepare.outputs.dry_run != 'true'
    uses: ./.github/workflows/release-github.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      is_prerelease: ${{ needs.prepare.outputs.is_prerelease }}
      npm_dist_tag: ${{ needs.prepare.outputs.npm_dist_tag }}
      specado_pkg: ${{ needs.prepare.outputs.specado_pkg }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip non-tag invocations
        run: echo 'Release workflow only runs for v* tags.'

  prepare:
    if: startsWith(github.ref, "refs/tags/v")
    uses: ./.github/workflows/release-prepare.yml

  test:
    if: startsWith(github.ref, "refs/tags/v")
    needs: prepare
    uses: ./.github/workflows/release-test.yml

  package:
    needs:
      - prepare
      - test
    uses: ./.github/workflows/release-package.yml
    if: ${{ needs.prepare.result == 'success' }}
    with:
      version: ${{ needs.prepare.outputs.version || '' }}

  publish:
    needs:
      - prepare
      - package
    uses: ./.github/workflows/release-publish.yml
    if: ${{ needs.prepare.result == 'success' && needs.package.result == 'success' }}
    with:
      version: ${{ needs.prepare.outputs.version || '' }}
      tag: ${{ needs.prepare.outputs.tag || '' }}
      is_prerelease: ${{ (needs.prepare.outputs.is_prerelease || 'false') == 'true' }}
      npm_dist_tag: ${{ needs.prepare.outputs.npm_dist_tag || 'latest' }}
      artifact_name: ${{ needs.package.outputs.artifact_name || '' }}

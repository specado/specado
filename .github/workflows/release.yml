name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_production_pypi:
        description: 'Publish to production PyPI'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin twine

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            crates/specado-node/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Rust tests
        run: cargo test --workspace --verbose

      - name: Build Node.js bindings
        run: |
          cd crates/specado-node
          npm ci
          npm run build

      - name: Run Node.js tests
        run: |
          cd crates/specado-node
          npm test

      - name: Build Python bindings
        run: |
          maturin build -m crates/specado-py/Cargo.toml --release --out dist

      - name: Run Python tests
        run: |
          python -m pip install dist/*.whl
          python -m pytest python/tests/ -v

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin twine

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI binary
        run: cargo build --release --package specado-cli

      - name: Build Node.js package
        run: |
          cd crates/specado-node
          npm ci
          npm run build

      - name: Build Python wheels
        run: |
          maturin build -m crates/specado-py/Cargo.toml --release --out dist --sdist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/release/specado
            crates/specado-node/npm/
            dist/

  publish-testpypi:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install twine
        run: pip install twine

      - name: Publish to Test PyPI
        run: |
          twine upload --repository testpypi dist/*.whl dist/*.tar.gz
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
          TWINE_NON_INTERACTIVE: 1

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    environment: release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: crates/specado-node/npm/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: |
          cd crates/specado-node
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Publish specado-core
        run: cargo publish --package specado-core --token ${{ secrets.CRATES_IO_TOKEN }} --allow-dirty
        continue-on-error: true

      - name: Wait for core propagation
        run: sleep 30

      - name: Publish specado-schemas
        run: cargo publish --package specado-schemas --token ${{ secrets.CRATES_IO_TOKEN }} --allow-dirty

      - name: Wait for schemas propagation
        run: sleep 30

      - name: Publish specado-providers
        run: cargo publish --package specado-providers --token ${{ secrets.CRATES_IO_TOKEN }} --allow-dirty

      - name: Wait for providers propagation
        run: sleep 30

      - name: Publish specado-cli
        run: cargo publish --package specado-cli --token ${{ secrets.CRATES_IO_TOKEN }} --allow-dirty

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [publish-testpypi, publish-npm, publish-crates]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_production_pypi == 'true'
    environment: release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install twine
        run: pip install twine

      - name: Publish to PyPI
        run: |
          twine upload dist/*.whl dist/*.tar.gz
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_NON_INTERACTIVE: 1

  verify:
    name: Verify Releases
    runs-on: ubuntu-latest
    needs: [publish-testpypi, publish-npm, publish-crates]
    if: github.event_name == 'release'
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify npm package
        run: |
          npm info specado version
          mkdir test-npm && cd test-npm
          npm init -y
          npm install specado
          npx specado --help

      - name: Verify Test PyPI package
        run: |
          python -m venv test-pypi
          source test-pypi/bin/activate
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple specado
          python -c "import specado; print(f'Test PyPI version: {specado.__version__}')"

      - name: Verify crates.io package
        run: |
          cargo install specado-cli
          specado --help

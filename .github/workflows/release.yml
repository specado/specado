name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
  RUST_TOOLCHAIN: stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 🎯 Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      npm_dist_tag: ${{ steps.meta.outputs.npm_dist_tag }}
      run_release: ${{ steps.meta.outputs.run_release }}
    steps:
      - name: Compute release metadata
        id: meta
        run: |
          set -euo pipefail
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "npm_dist_tag=beta" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "npm_dist_tag=latest" >> "$GITHUB_OUTPUT"
            fi
          else
            SHORT_SHA="${GITHUB_SHA:0:7}"
            echo "run_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
            echo "version=$SHORT_SHA" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: crates/specado-node/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install maturin twine

      - name: Create Python virtualenv for tests
        run: python -m venv .venv

      - name: Install venv dependencies
        run: |
          source .venv/bin/activate
          pip install --upgrade pip
          pip install maturin pytest

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --workspace --locked --all-features

      - name: Build Node.js bindings
        run: |
          cd crates/specado-node
          npm ci
          npm run build

      - name: Run Node.js tests
        run: |
          cd crates/specado-node
          npm test

      - name: Build Python wheel for tests
        run: maturin build -m crates/specado-py/Cargo.toml --release --out dist-test

      - name: Install wheel under test
        run: |
          python -m pip install dist-test/*.whl
          python -c "import sys, specado; from pathlib import Path; pkg_path = Path(specado.__file__).parent; native = list(pkg_path.glob('_native*.so')); print('Installed package path:', pkg_path); print('Native binaries:', native); sys.exit(0 if native else (print('specado wheel missing native extension', file=sys.stderr) or 1))"

      - name: Install python package from source for tests
        run: |
          source .venv/bin/activate
          maturin develop -m crates/specado-py/Cargo.toml --release

      - name: Run Python tests
        run: |
          source .venv/bin/activate
          python -m pytest python/tests/ -v

  build_platforms:
    name: 🔨 Build artifacts (${{ matrix.display }})
    needs:
      - prepare
      - test
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            display: Linux
            artifact_suffix: linux-x64
            node_binary: specado.linux-x64-gnu.node
            python_args: "--release --out dist/python --sdist"
          - os: macos-latest
            display: macOS
            artifact_suffix: macos-arm64
            node_binary: specado.darwin-arm64.node
            python_args: "--release --out dist/python"
          - os: windows-latest
            display: Windows
            artifact_suffix: windows-x64
            node_binary: specado.win32-x64-msvc.node
            python_args: "--release --out dist/python"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Build CLI binary
        run: cargo build --release --locked --package specado-cli

      - name: Build Node.js bindings
        run: |
          cd crates/specado-node
          npm ci
          npm run build

      - name: Build Python distributions
        run: |
          set -euo pipefail
          rm -rf dist/python
          maturin build -m crates/specado-py/Cargo.toml ${{ matrix.python_args }}

      - name: Collect platform artifacts
        run: |
          set -euo pipefail
          OUT_DIR="build-out"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR/node" "$OUT_DIR/python" "$OUT_DIR/cli"

          NODE_FILE=$(find crates/specado-node -maxdepth 1 -name '${{ matrix.node_binary }}' -print -quit)
          if [[ -z "$NODE_FILE" ]]; then
            echo "Node binary ${{ matrix.node_binary }} not found" >&2
            exit 1
          fi
          cp "$NODE_FILE" "$OUT_DIR/node/"

          find dist/python -maxdepth 1 -type f -name '*.whl' -exec cp {} "$OUT_DIR/python/" \;
          find dist/python -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} "$OUT_DIR/python/" \;

          CLI_FILE=$(find target/release -maxdepth 1 -type f \( -name 'specado' -o -name 'specado.exe' \) -print -quit)
          if [[ -z "$CLI_FILE" ]]; then
            echo "CLI binary not found" >&2
            exit 1
          fi
          cp "$CLI_FILE" "$OUT_DIR/cli/"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: specado-build-${{ matrix.artifact_suffix }}
          path: build-out

  smoke_test:
    name: 🔍 Smoke test binaries
    needs:
      - prepare
      - build_platforms
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: specado-build-linux-x64
            binary_path: cli/specado
          - os: macos-latest
            artifact: specado-build-macos-arm64
            binary_path: cli/specado
          - os: windows-latest
            artifact: specado-build-windows-x64
            binary_path: cli/specado.exe
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: test-bin

      - name: Make binary executable
        if: runner.os != 'Windows'
        run: chmod +x test-bin/${{ matrix.binary_path }}

      - name: Test CLI binary version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          OUTPUT=$(test-bin/${{ matrix.binary_path }} --version)
          echo "Binary output: $OUTPUT"
          if [[ "$OUTPUT" != *"$VERSION"* ]]; then
            echo "Error: Binary version does not match expected version $VERSION" >&2
            exit 1
          fi

      - name: Test CLI binary help
        shell: bash
        run: |
          test-bin/${{ matrix.binary_path }} --help >/dev/null

  package:
    name: 📦 Package artifacts
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build_platforms
      - smoke_test
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: specado-build-*
          path: build-artifacts
          merge-multiple: false

      - name: Prepare dist directories
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/python dist/npm dist/cli

      - name: Assemble multi-platform distributions
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          rm -f crates/specado-node/specado.*.node

          find build-artifacts -path '*/node/*' -name 'specado.*.node' -exec cp {} crates/specado-node/ \;

          find build-artifacts -path '*/python/*' -name '*.whl' -exec cp {} dist/python/ \;
          find build-artifacts -path '*/python/*' -name 'specado-*.tar.gz' -exec cp {} dist/python/ \;

          shopt -s nullglob
          for cli_dir in build-artifacts/specado-build-*/cli; do
            platform=${cli_dir#build-artifacts/specado-build-}
            platform=${platform%/cli}
            bin=$(find "$cli_dir" -maxdepth 1 -type f -print -quit)
            if [[ -z "$bin" ]]; then
              echo "No CLI binary found in $cli_dir" >&2
              exit 1
            fi
            filename=$(basename "$bin")
            if [[ "$filename" == *.exe ]]; then
              zip -j "dist/cli/specado-${VERSION}-${platform}.zip" "$bin"
            else
              tar czf "dist/cli/specado-${VERSION}-${platform}.tar.gz" -C "$cli_dir" "$filename"
            fi
          done
          shopt -u nullglob

      - name: Create npm package
        run: |
          set -euo pipefail
          cd crates/specado-node
          npm pack --pack-destination ../../dist/npm
          rm -f specado.*.node

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload aggregated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: specado-release-${{ needs.prepare.outputs.version }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  publish_testpypi:
    name: 🐍 Publish to Test PyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/specado/${{ needs.prepare.outputs.version }}
    needs:
      - prepare
      - package
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: specado-release-${{ needs.prepare.outputs.version }}
          path: artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish to Test PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
          TWINE_NON_INTERACTIVE: 1
        run: |
          set -euo pipefail
          python -m twine upload \
            --repository-url https://test.pypi.org/legacy/ \
            --disable-progress-bar \
            --skip-existing \
            artifacts/python/*

  verify_testpypi:
    name: ✅ Verify Test PyPI package
    runs-on: ubuntu-latest
    needs:
      - prepare
      - publish_testpypi
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test install from Test PyPI
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv test-venv
          source test-venv/bin/activate
          pip install --upgrade pip
          for attempt in {1..5}; do
            if pip install --index-url https://test.pypi.org/simple/ \
                          --extra-index-url https://pypi.org/simple \
                          "specado==${VERSION}"; then
              break
            fi
            if [[ $attempt -eq 5 ]]; then
              echo "Test PyPI package not available after retries" >&2
              exit 1
            fi
            echo "Test PyPI package not yet available (attempt ${attempt}); retrying in 30s..."
            sleep 30
          done
          python -c "import specado; print('Test PyPI package version:', specado.__version__)"

  publish_npm:
    name: 📦 Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/specado/v/${{ needs.prepare.outputs.version }}
    needs:
      - prepare
      - package
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: specado-release-${{ needs.prepare.outputs.version }}
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ needs.prepare.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/npm/*.tgz)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one npm tarball, found ${#files[@]}" >&2
            ls -l artifacts/npm
            exit 1
          fi
          npm publish "${files[0]}" --tag "$NPM_DIST_TAG"

  publish_crates:
    name: 🦀 Publish to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/specado
    needs:
      - prepare
      - package
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates sequentially
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          CRATES=(specado specado-cli)
          publishable=()
          for crate in "${CRATES[@]}"; do
            manifest="crates/${crate}/Cargo.toml"
            if [[ ! -f "${manifest}" ]]; then
              echo "Skipping ${crate}: manifest ${manifest} not found."
              continue
            fi
            if grep -Eq '^[[:space:]]*publish[[:space:]]*=[[:space:]]*false' "${manifest}" || \
               grep -Eq '^[[:space:]]*publish[[:space:]]*=[[:space:]]*\[[[:space:]]*\]' "${manifest}"; then
              echo "Skipping ${crate}: publish=false in Cargo.toml"
              continue
            fi
            publishable+=("${crate}")
          done
          if [[ ${#publishable[@]} -eq 0 ]]; then
            echo "No crates configured for publication; skipping crates.io publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for crate in "${publishable[@]}"; do
            echo "::group::Publishing ${crate}"
            cargo publish --package "${crate}" --locked
            echo "::endgroup::"
            if [[ "${crate}" != "${publishable[-1]}" ]]; then
              echo "Waiting for crate index propagation..."
              sleep 60
            fi
          done
          echo "published=true" >> "$GITHUB_OUTPUT"

  publish_pypi:
    name: 🐍 Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/specado/${{ needs.prepare.outputs.version }}
    needs:
      - prepare
      - verify_testpypi
      - publish_npm
      - publish_crates
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: specado-release-${{ needs.prepare.outputs.version }}
          path: artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_NON_INTERACTIVE: 1
        run: |
          set -euo pipefail
          python -m twine upload \
            --disable-progress-bar \
            --skip-existing \
            artifacts/python/*

  verify_release:
    name: ✅ Verify published artifacts
    runs-on: ubuntu-latest
    needs:
      - prepare
      - verify_testpypi
      - publish_npm
      - publish_crates
      - publish_pypi
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify npm package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NPM_DIST_TAG: ${{ needs.prepare.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if npm view specado@"$VERSION" version >/dev/null 2>&1; then
              break
            fi
            if [[ $attempt -eq 5 ]]; then
              echo "npm package not available after retries" >&2
              exit 1
            fi
            delay=$((30 * attempt))
            echo "npm package not yet available (attempt ${attempt}); retrying in ${delay}s..."
            sleep $delay
          done
          mkdir verify-npm
          cd verify-npm
          npm init -y >/dev/null
          npm install specado@"$VERSION" >/dev/null
          node -e "const { execSync } = require('node:child_process'); const distTags = JSON.parse(execSync('npm view specado dist-tags --json', { encoding: 'utf8' })); const expectedTag = process.env.NPM_DIST_TAG; const expectedVersion = process.env.VERSION; if (!distTags || !Object.prototype.hasOwnProperty.call(distTags, expectedTag)) { console.error(\`Expected npm dist-tag '\${expectedTag}' to be present, found:\`, distTags); process.exit(1); } if (distTags[expectedTag] !== expectedVersion) { console.error(\`Dist-tag '\${expectedTag}' points to '\${distTags[expectedTag]}', expected '\${expectedVersion}'\`); process.exit(1); }"
          node -e "const specado = require('specado'); if (!specado) { throw new Error('specado module did not load'); }"

      - name: Verify PyPI package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          python -m venv verify-py
          source verify-py/bin/activate
          python -m pip install --upgrade pip
          for attempt in {1..5}; do
            args=("specado==${VERSION}")
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              args+=("--pre")
            fi
            if python -m pip install "${args[@]}"; then
              break
            fi
            if [[ $attempt -eq 5 ]]; then
              echo "PyPI package not available after retries" >&2
              exit 1
            fi
            delay=$((30 * attempt))
            echo "PyPI package not yet available (attempt ${attempt}); retrying in ${delay}s..."
            sleep $delay
          done
          python -c "import specado; print(specado.__version__)"

      - name: Verify crates.io package
        if: ${{ needs.publish_crates.outputs.published == 'true' }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if cargo install specado-cli --version "$VERSION" --locked --root "$PWD/verify-cargo" --force; then
              break
            fi
            if [[ $attempt -eq 5 ]]; then
              echo "crates.io package not available after retries" >&2
              exit 1
            fi
            delay=$((30 * attempt))
            echo "crates.io package not yet available (attempt ${attempt}); retrying in ${delay}s..."
            sleep $delay
          done
          "$PWD/verify-cargo/bin/specado" --help >/dev/null

      - name: Verify specado library crate
        if: ${{ needs.publish_crates.outputs.published == 'true' }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cargo new verify-lib --lib --quiet
          cd verify-lib
          cargo add specado@=$VERSION >/dev/null
          cargo check >/dev/null

  github_release:
    name: 🚀 Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - verify_testpypi
      - publish_npm
      - publish_crates
      - publish_pypi
      - verify_release
    if: ${{ needs.prepare.outputs.run_release == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create or update GitHub Release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          NPM_DIST_TAG: ${{ needs.prepare.outputs.npm_dist_tag }}
        with:
          script: |
            const version = process.env.VERSION;
            const tag = process.env.TAG;
            const prerelease = process.env.IS_PRERELEASE === 'true';
            const npmTag = process.env.NPM_DIST_TAG;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pythonInstall = prerelease
              ? `pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple specado==${version}`
              : `pip install specado==${version}`;
            const bodyLines = [
              '## Installation',
              '',
              `**npm (${npmTag} dist-tag)**`,
              '```bash',
              `npm install specado@${version}`,
              '```',
              '',
              `**Python${prerelease ? ' (Test PyPI)' : ''}**`,
              '```bash',
              pythonInstall,
              '```',
              '',
              '**Rust**',
              '```toml',
              `specado = "${version}"`,
              '```',
              '',
              'Artifacts for this tag (npm tarball, Python wheels/sdist, CLI tarball, and SHA256 manifest) are attached to the workflow run and available from the respective registries.'
            ];
            const body = bodyLines.join('\n');

            async function createOrUpdateRelease() {
              try {
                const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: release.data.id,
                  tag_name: tag,
                  name: prerelease ? `Pre-release ${tag}` : `Release ${tag}`,
                  body,
                  prerelease
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.repos.createRelease({
                    owner,
                    repo,
                    tag_name: tag,
                    name: prerelease ? `Pre-release ${tag}` : `Release ${tag}`,
                    body,
                    prerelease
                  });
                } else {
                  throw error;
                }
              }
            }

            await createOrUpdateRelease();

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: specado-release-${{ needs.prepare.outputs.version }}
          path: artifacts

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          if [[ -f artifacts/SHA256SUMS ]]; then
            assets+=("artifacts/SHA256SUMS")
          fi
          for file in artifacts/cli/*.tar.gz; do
            assets+=("$file")
          done
          for file in artifacts/cli/*.zip; do
            assets+=("$file")
          done
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets to upload."
            exit 0
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber

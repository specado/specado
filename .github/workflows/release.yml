name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    uses: ./.github/workflows/release-prepare.yml

  test:
    needs: prepare
    uses: ./.github/workflows/release-test.yml
    with:
      skip_release: ${{ needs.prepare.outputs.skip_release }}

  package:
    needs:
      - prepare
      - test
    if: ${{ needs.test.result == 'success' }}
    uses: ./.github/workflows/release-package.yml
    with:
      version: ${{ needs.prepare.outputs.version || '' }}
      skip_release: ${{ needs.prepare.outputs.skip_release }}

  publish:
    needs:
      - prepare
      - package
    if: ${{ needs.package.result == 'success' }}
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ needs.prepare.outputs.version || '' }}
      tag: ${{ needs.prepare.outputs.tag || '' }}
      is_prerelease: ${{ (needs.prepare.outputs.is_prerelease || 'false') == 'true' }}
      npm_dist_tag: ${{ needs.prepare.outputs.npm_dist_tag || 'latest' }}
      artifact_name: ${{ needs.package.outputs.artifact_name || '' }}
      skip_release: ${{ needs.prepare.outputs.skip_release }}

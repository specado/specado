name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-rust:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace --all-features
        env:
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Placeholder scaffolding checks
        shell: bash
        run: |
          ./tests/golden/update_snapshots.sh
          ./tests/integration/run_smoke.sh
  test-python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build and test
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/python ]; then
            VENV_PY=".venv/bin/python"
          else
            VENV_PY=".venv/Scripts/python"
          fi
          "$VENV_PY" -m pip install --upgrade pip
          "$VENV_PY" -m pip install maturin pytest
          "$VENV_PY" -m maturin develop -m crates/specado-py/Cargo.toml
          "$VENV_PY" -m pytest python/tests/
        env:
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

  test-node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        working-directory: crates/specado-node
        run: npm install

      - name: Build addon
        working-directory: crates/specado-node
        run: npm run build:debug
        env:
          OPENAI_API_KEY: test-key
          ANTHROPIC_API_KEY: test-key

      - name: Test addon
        working-directory: crates/specado-node
        run: npm test
